<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cristian Urbano</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --ground:#f5f2ed; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ground:#1a1720; }
  }
  :root[data-theme="dark"] { --ground:#1a1720; }
  html, body { height:100%; }
  body { margin:0; background:var(--ground); }
  iframe { display:block; width:100%; height:100%; border:0; background:var(--ground); }
</style>

<iframe id="site" title="Cristian Urbano" src="Cristian%20Urbano.dc.html"></iframe>

<script>
  // The site lives in the frame above. Saving a file needs the page that frames it,
  // so the frame asks here and this page offers the CV PDF through the viewer's save prompt.
  (function () {
    var frame = document.getElementById("site");
    var downloads = null;
    function post(msg) {
      try { frame.contentWindow.postMessage(Object.assign({ cu: true }, msg), "*"); } catch (e) {}
    }
    function announce() { post({ type: "caps", pdf: true }); }
    window.addEventListener("message", function (e) {
      if (e.source !== frame.contentWindow) return;
      var d = e.data;
      if (!d || d.cu !== true) return;
      if (d.type === "hello") { announce(); return; }
      if (d.type !== "download") return;
      var lang = d.lang === "es" ? "es" : "en";
      if (!downloads) {
        var a = document.createElement("a");
        a.href = "cristian-urbano-" + lang + ".pdf";
        a.download = "Cristian-Urbano-CV-" + lang.toUpperCase() + ".pdf";
        document.body.appendChild(a); a.click(); a.remove();
        post({ type: "result", status: "saved" });
        return;
      }
      fetch("cristian-urbano-" + lang + ".pdf")
        .then(function (r) { if (!r.ok) throw new Error("missing"); return r.blob(); })
        .then(function (blob) {
          return downloads.save({ filename: "Cristian-Urbano-CV-" + lang.toUpperCase() + ".pdf", data: blob });
        })
        .then(function (res) { post({ type: "result", status: (res && res.status) || "saved" }); })
        .catch(function (err) { post({ type: "result", status: (err && err.code) || "error" }); });
    });
    try {
      if (window.claude && window.claude.use) {
        window.claude.use("downloads").then(function (d) { downloads = d; announce(); }, function () {});
      }
    } catch (e) {}
  })();
</script>

</body></html>
